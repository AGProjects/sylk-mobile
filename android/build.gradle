// Top-level build file where you can add configuration options common to all sub-projects/modules.
def REACT_NATIVE_VERSION = new File(['node', '--print',"JSON.parse(require('fs').readFileSync(require.resolve('react-native/package.json'), 'utf-8')).version"].execute(null, rootDir).text.trim())

buildscript {
    ext.kotlin_version = '2.0.21'

    ext {
        buildToolsVersion = "36.0.0"
        // Bumped 24 -> 26 for react-native-vision-camera (requires minSdk 26).
        // Drops Android 7.0/7.1 (API 24-25). 2026-07-23.
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        //supportLibVersion = "30.0.0"
        // NDK r29 (clang 20). Verified 2026-07-27: compiles the E2EE relative-vtables
        // code (NDK 27 clang 18.0.2 SIGILL'd on it; NDK 25 clang 14 was the old floor),
        // ZRTP/E2EE call verified, and 16 KB alignment + fbjni basic_stringstream come
        // from the toolchain — so the old jniLibs-libc++ vendoring and CMake max-page-size
        // inject were both removed. Do NOT drop below NDK 27 without restoring those.
        ndkVersion = "29.0.14206865"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        //classpath("com.android.tools.build:gradle")
        // AGP 8.9.1+ officially supports compileSdk 36 (requires Gradle 8.11.1+)
        classpath("com.android.tools.build:gradle:8.9.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        //classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21")

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath 'com.google.gms:google-services:4.4.1'  // Google Services plugin
    }
}


subprojects { subproject ->
    // --- 16 KB page-size alignment (Android 15+ / Google Play requirement) ---
    // Force MMKV 1.3.14 everywhere. @kesha-antonov/react-native-background-downloader
    // pulls com.tencent:mmkv:1.3.12, whose prebuilt libmmkv.so is only 4 KB-aligned.
    // 1.3.14 ships a 16 KB-aligned libmmkv.so and still keeps the 32-bit ABIs.
    configurations.all {
        resolutionStrategy {
            force 'com.tencent:mmkv:1.3.14'
        }
    }

    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library') || project.plugins.hasPlugin('com.android.application')) {
            // Disable lint abort on error for all modules
            project.android.lintOptions {
                abortOnError false
            }

            // Override compileSdkVersion and targetSdkVersion for all modules
            project.android.compileSdkVersion = 36
            project.android.defaultConfig.targetSdkVersion = 36

        }
    }
}

apply plugin: "com.facebook.react.rootproject"
