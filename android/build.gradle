// Top-level build file where you can add configuration options common to all sub-projects/modules.
def REACT_NATIVE_VERSION = new File(['node', '--print',"JSON.parse(require('fs').readFileSync(require.resolve('react-native/package.json'), 'utf-8')).version"].execute(null, rootDir).text.trim())

buildscript {
    ext.kotlin_version = '1.9.24'

    ext {
        buildToolsVersion = "36.0.0"
        // Bumped 24 -> 26 for react-native-vision-camera (requires minSdk 26).
        // Drops Android 7.0/7.1 (API 24-25). 2026-07-23.
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        //supportLibVersion = "30.0.0"
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        //classpath("com.android.tools.build:gradle")
        // AGP 8.9.1+ officially supports compileSdk 36 (requires Gradle 8.11.1+)
        classpath("com.android.tools.build:gradle:8.9.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        //classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath 'com.google.gms:google-services:4.4.1'  // Google Services plugin
    }
}


subprojects { subproject ->
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library') || project.plugins.hasPlugin('com.android.application')) {
            // Disable lint abort on error for all modules
            project.android.lintOptions {
                abortOnError false
            }

            // Override compileSdkVersion and targetSdkVersion for all modules
            project.android.compileSdkVersion = 36
            project.android.defaultConfig.targetSdkVersion = 36
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
